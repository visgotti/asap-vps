# Every pull request, and every push to master: type-check, build, and the
# offline test suite with its coverage thresholds (package.json "jest":
# at least 90% of statements, branches, functions and lines, and 100% on each
# Scaleway source file). The live suites (*.live.spec.ts) rent real machines
# and run only by hand. master's branch protection requires each job below.
#
# The jobs run on GitHub's runners, or on the self-hosted ones the repository
# variable CI_RUNS_ON names (a JSON list of labels, such as
# ["self-hosted","linux","x64","asap-vps"]): `gh variable set CI_RUNS_ON`, and
# `gh variable delete CI_RUNS_ON` to go back. A pull request from a fork never
# runs on a self-hosted runner: its code could read what else that machine
# holds. (The repository also requires approval before any outside
# contributor's workflow runs at all.)
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node package.json "engines" admits, and the current LTS lines.
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - run: npm run test:coverage
