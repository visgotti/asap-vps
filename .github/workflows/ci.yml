# Every pull request, and every push to master: type-check, build, and the
# offline test suite with its coverage thresholds (package.json "jest":
# at least 90% of statements, branches, functions and lines, and 100% on each
# Scaleway source file). The live suites (*.live.spec.ts) rent real machines
# and run only by hand. master's branch protection requires each job below.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node package.json "engines" admits, and the current LTS lines.
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - run: npm run test:coverage
