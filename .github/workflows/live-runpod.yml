# RunPod against its real API: every suite, on the cheapest GPU in stock at or under $1 an hour
# (minutes each: well under a dollar for them all).
#
# Started by hand and by nothing else, with nothing to fill in: Actions > "Live: RunPod" > Run workflow
# (or `gh workflow run live-runpod.yml`). Each suite is a job of its own, one after another, so the run
# shows which of them failed, and "Re-run failed jobs" runs those alone:
#   RunPodSsh.live                 logging in over SSH, and a user of its own
#   RunPod.live                    the whole lifecycle on a GPU pod
#   RunPodCpu.live                 a CPU pod
#   RunPodRegistry.live            a private image
#   RunPodServerless.live          serverless endpoints
#   RunPodVolumes.live             network volumes
# Runs on one provider's account wait for each other: each suite first deletes what earlier runs left there.
# What runs a suite, its keys and its clean-up: live.yml.
name: 'Live: RunPod'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-runpod
  cancel-in-progress: false

jobs:
  suite:
    name: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite:
          - RunPodSsh
          - RunPod
          - RunPodCpu
          - RunPodRegistry
          - RunPodServerless
          - RunPodVolumes
    uses: ./.github/workflows/live.yml
    secrets: inherit
    with:
      provider: runpod
      targets: runpod
      pattern: src/Providers/RunPod/${{ matrix.suite }}.live.spec
      timeout_minutes: 180
