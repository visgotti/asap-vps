# Vast.ai against its real API: every suite, on the cheapest machines in stock at or under $1 an hour
# (cents for them all).
#
# Started by hand and by nothing else, with nothing to fill in: Actions > "Live: Vast" > Run workflow
# (or `gh workflow run live-vast.yml`). Each suite is a job of its own, one after another, so the run
# shows which of them failed, and "Re-run failed jobs" runs those alone:
#   VastSsh.live                   logging in over SSH, and a user of its own
#   VastAI.live                    the whole lifecycle on a GPU instance
#   VastExtras.live                userData and diskGb
#   VastImages.live                snapshots as images
#   VastRegistry.live              a private image
#   VastVolumes.live               volumes
# Runs on one provider's account wait for each other: each suite first deletes what earlier runs left there.
# What runs a suite, its keys and its clean-up: live.yml.
name: 'Live: Vast'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-vast
  cancel-in-progress: false

jobs:
  suite:
    name: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite:
          - VastSsh
          - VastAI
          - VastExtras
          - VastImages
          - VastRegistry
          - VastVolumes
    uses: ./.github/workflows/live.yml
    secrets: inherit
    with:
      provider: vast
      targets: vast
      pattern: src/Providers/VastAI/${{ matrix.suite }}.live.spec
      timeout_minutes: 180
