# DigitalOcean against its real API (the account is a production one): every suite that rents no GPU,
# on the smallest droplets, for cents. The lifecycle on a GPU droplet is its own workflow (live-digitalocean-gpu.yml).
#
# Started by hand and by nothing else, with nothing to fill in: Actions > "Live: DigitalOcean" > Run workflow
# (or `gh workflow run live-digitalocean.yml`). Each suite is a job of its own, one after another, so the run
# shows which of them failed, and "Re-run failed jobs" runs those alone:
#   DigitalOceanVps.live           as a VPS host: one s-1vcpu-1gb droplet
#   DigitalOceanCpu.live           the whole lifecycle, images too, on the cheapest droplet
#   DigitalOceanContainer.live     a container run on a droplet
#   DigitalOceanImageImport.live   an image imported from a URL
#   DigitalOceanShares.live        shared volumes
#   DigitalOceanVolumes.live       block volumes
# Runs on one provider's account wait for each other: each suite first deletes what earlier runs left there.
# What runs a suite, its keys and its clean-up: live.yml.
name: 'Live: DigitalOcean'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-digitalocean
  cancel-in-progress: false

jobs:
  suite:
    name: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite:
          - DigitalOceanVps
          - DigitalOceanCpu
          - DigitalOceanContainer
          - DigitalOceanImageImport
          - DigitalOceanShares
          - DigitalOceanVolumes
    uses: ./.github/workflows/live.yml
    secrets: inherit
    with:
      provider: digitalocean
      targets: digitalocean,digitalocean-cpu,digitalocean-vps
      pattern: src/Providers/DigitalOcean/${{ matrix.suite }}.live.spec
      timeout_minutes: 300
