# Scaleway against its real API: every suite that rents no GPU, on STARDUST1-S Instances, for cents.
# The lifecycle on a GPU Instance is its own workflow (live-scaleway-gpu.yml).
#
# Started by hand and by nothing else, with nothing to fill in: Actions > "Live: Scaleway" > Run workflow
# (or `gh workflow run live-scaleway.yml`). Each suite is a job of its own, one after another, so the run
# shows which of them failed, and "Re-run failed jobs" runs those alone:
#   ScalewayVps.live               as a VPS host: one STARDUST1-S Instance
#   ScalewayCpu.live               the whole lifecycle on a STARDUST1-S Instance
#   ScalewayContainer.live         a container run on an Instance
#   ScalewayDisks.live             an Instance's own disks
#   ScalewayImages.live            images
#   ScalewayServerless.live        serverless containers
#   ScalewayShares.live            shared volumes
#   ScalewayVolumes.live           Block Storage volumes
# Runs on one provider's account wait for each other: each suite first deletes what earlier runs left there.
# What runs a suite, its keys and its clean-up: live.yml.
name: 'Live: Scaleway'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-scaleway
  cancel-in-progress: false

jobs:
  suite:
    name: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite:
          - ScalewayVps
          - ScalewayCpu
          - ScalewayContainer
          - ScalewayDisks
          - ScalewayImages
          - ScalewayServerless
          - ScalewayShares
          - ScalewayVolumes
    uses: ./.github/workflows/live.yml
    secrets: inherit
    with:
      provider: scaleway
      targets: scaleway,scaleway-cpu,scaleway-vps
      pattern: src/Providers/Scaleway/${{ matrix.suite }}.live.spec
      timeout_minutes: 300
