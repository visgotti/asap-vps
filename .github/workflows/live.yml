# One live suite (a *.live.spec.ts): a provider against its real API, with the
# account's keys from this repository's secrets. A live suite rents real
# servers, so nothing here runs on a push or a pull request: this is only ever
# called by the workflows that are started by hand (live-<provider>.yml), once
# for each suite they run.
#
# It ends by deleting whatever the provider's test runs have left on the
# account (asap-vps-smoke-*), whatever happened to the suite: a run deletes
# what it made and a watchdog does it for a run that dies, but a job that is
# cancelled or times out takes both down with it.
#
# The keys: `gh secret set` for DIGITAL_OCEAN_API_KEY, LAMBDA_API_KEY,
# RUNPOD_API_KEY, VAST_API_KEY, SCW_SECRET_KEY, SCW_ACCESS_KEY and
# SCW_DEFAULT_PROJECT_ID; `gh variable set` for SCW_ZONES (unset: every zone).
# Every suite is given all of them: some need a second account (a private
# registry is made in Scaleway's for the registry, container and Vast image
# suites).
#
# Like ci.yml, the job runs on GitHub's runners or on the self-hosted ones the
# variable CI_RUNS_ON names. The logs are public, as the repository is: GitHub
# masks the secrets in them, and the suites print no key.
name: Live suite

on:
  workflow_call:
    inputs:
      provider:
        description: The provider's id (digitalocean, scaleway, lambda, runpod, vast)
        required: true
        type: string
      targets:
        description: What ASAP_VPS_LIVE is set to (the provider's targets)
        required: true
        type: string
      pattern:
        description: The path pattern of the suite's file (jest's)
        required: true
        type: string
      max_price:
        description: The most a rented GPU may cost, USD per hour
        type: string
        default: '1'
      timeout_minutes:
        type: number
        default: 180

permissions:
  contents: read

jobs:
  live:
    name: ${{ inputs.provider }}
    runs-on: ${{ vars.CI_RUNS_ON && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      DIGITAL_OCEAN_API_KEY: ${{ secrets.DIGITAL_OCEAN_API_KEY }}
      LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_ZONES: ${{ vars.SCW_ZONES }}
      ASAP_VPS_LIVE: ${{ inputs.targets }}
      ASAP_VPS_LIVE_MAX_PRICE: ${{ inputs.max_price }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the suite
        env:
          PATTERN: ${{ inputs.pattern }}
        run: npx jest --config jest.live.config.js "$PATTERN"
      - name: Delete what a run that was cut short left behind
        if: ${{ always() }}
        env:
          PROVIDER: ${{ inputs.provider }}
        run: npm run -s gpu:smoke -- "$PROVIDER" --sweep
